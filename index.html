<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VoiceRec</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: light-dark(#f4f1ea, #1c1b19);
      color: light-dark(#1c1b19, #f4f1ea);
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 32px 20px calc(64px + env(safe-area-inset-bottom));
    }
    #time {
      margin: 0;
      text-align: center;
      font-size: 64px;
      font-weight: 500;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #next {
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-all;
    }
    .transport {
      display: flex;
      gap: 8px;
      margin-top: 28px;
    }
    button {
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      border-radius: 999px;
      min-height: 48px;
      padding: 0 12px;
    }
    .transport button { flex: 1 1 0; }
    #start {
      border: 0;
      background: light-dark(#0b57d0, #a8c7fa);
      color: light-dark(#fff, #062e6f);
    }
    .plain {
      border: 1px solid light-dark(#c9c4ba, #4a463f);
      background: transparent;
      color: inherit;
    }
    button:disabled { opacity: 0.4; }
    #download {
      display: block;
      width: 100%;
      margin-top: 8px;
      border: 1px solid light-dark(#0b57d0, #a8c7fa);
      background: transparent;
      color: light-dark(#0b57d0, #a8c7fa);
    }
    #status {
      min-height: 1.4em;
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-all;
    }
    #setting {
      position: fixed;
      left: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      min-height: 32px;
      padding: 0 10px;
      font-size: 12px;
      border: 1px solid light-dark(#c9c4ba, #4a463f);
      background: light-dark(#f4f1ea, #1c1b19);
      color: inherit;
    }
    #setting-panel {
      position: fixed;
      left: 12px;
      bottom: calc(52px + env(safe-area-inset-bottom));
      width: min(240px, calc(100% - 24px));
      margin: 0;
      padding: 12px;
      border: 1px solid light-dark(#c9c4ba, #4a463f);
      border-radius: 12px;
      background: light-dark(#f4f1ea, #1c1b19);
      color: inherit;
    }
    #setting-panel p {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    #setting-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <p id="time">00:00</p>
    <p id="next">VoiceRec_(시작시각)_1</p>
    <div class="transport">
      <button type="button" id="start">Start</button>
      <button type="button" class="plain" id="pause" disabled>Pause</button>
      <button type="button" class="plain" id="stop" disabled>Stop</button>
    </div>
    <button type="button" id="download">Download</button>
    <p id="status" role="status"></p>
  </main>
  <div id="setting-panel" hidden>
    <p id="setting-note">형식과 음질은 다음 녹음부터 적용됩니다.</p>
    <div id="format-choices"></div>
    <p id="quality-note">음질. 기본은 Mid입니다.</p>
    <div id="quality-choices"></div>
  </div>
  <button type="button" id="setting" class="plain" aria-expanded="false" aria-controls="setting-panel">Setting</button>
  <script>
    (function () {
      var state = "idle";
      var busy = false;
      var stamp = "";
      var nextIndex = 1;
      var chunks = [];
      var mime = "";
      var stream = null;
      var recorder = null;
      var accumulated = 0;
      var segmentStart = 0;
      var timer = 0;
      var wakeLock = null;
      var pendingFlush = null;

      var timeEl = document.getElementById("time");
      var nextEl = document.getElementById("next");
      var statusEl = document.getElementById("status");
      var startBtn = document.getElementById("start");
      var pauseBtn = document.getElementById("pause");
      var stopBtn = document.getElementById("stop");
      var downloadBtn = document.getElementById("download");

      function pad(value) {
        return value < 10 ? "0" + value : String(value);
      }

      function elapsedMs() {
        if (state === "recording") return accumulated + (Date.now() - segmentStart);
        return accumulated;
      }

      function formatTime(ms) {
        var total = Math.floor(ms / 1000);
        var minutes = Math.floor(total / 60);
        var seconds = total % 60;
        return pad(minutes) + ":" + pad(seconds);
      }

      function stampNow() {
        var now = new Date();
        return String(now.getFullYear()).slice(2) +
          pad(now.getMonth() + 1) + pad(now.getDate()) + "_" +
          pad(now.getHours()) + pad(now.getMinutes());
      }

      function fileBase(index) {
        return "VoiceRec_(" + stamp + ")_" + String(index);
      }

      var FORMATS = {
        m4a: { label: "M4A", types: ["audio/mp4"], ext: ".m4a" },
        webm: { label: "WebM", types: ["audio/webm;codecs=opus", "audio/webm"], ext: ".webm" }
      };

      function supportedMime(key) {
        var types = FORMATS[key].types;
        if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
        for (var i = 0; i < types.length; i++) {
          if (MediaRecorder.isTypeSupported(types[i])) return types[i];
        }
        return "";
      }

      function availableKeys() {
        return ["m4a", "webm"].filter(function (key) { return supportedMime(key); });
      }

      function preferredKey() {
        var saved = "";
        try { saved = localStorage.getItem("voiceRecFormat") || ""; } catch (error) {}
        var available = availableKeys();
        if (saved && available.indexOf(saved) !== -1) return saved;
        if (available.indexOf("m4a") !== -1) return "m4a";
        return available[0] || "";
      }

      function activeType() {
        if (mime) return mime;
        var key = preferredKey();
        return key ? supportedMime(key) : "";
      }

      function extension() {
        var type = activeType();
        if (type.indexOf("mp4") !== -1) return ".m4a";
        if (type.indexOf("webm") !== -1) return ".webm";
        return "";
      }

      function paint() {
        timeEl.textContent = formatTime(elapsedMs());
        var base = stamp ? fileBase(nextIndex) : "VoiceRec_(시작시각)_1";
        nextEl.textContent = base + extension();
        pauseBtn.disabled = state !== "recording" || busy;
        stopBtn.disabled = (state !== "recording" && state !== "paused") || busy;
        startBtn.disabled = busy;
      }

      function tick() {
        paint();
      }

      var QUALITY = {
        high: { label: "High · 고음질, 고용량", bits: 256000 },
        mid: { label: "Mid", bits: 128000 },
        low: { label: "Low", bits: 64000 }
      };

      function preferredQuality() {
        var saved = "";
        try { saved = localStorage.getItem("voiceRecQuality") || ""; } catch (error) {}
        if (saved === "high" || saved === "low" || saved === "mid") return saved;
        return "mid";
      }

      function markAppliedLater() {
        if (mime) statusEl.textContent = "다음 녹음부터 적용됩니다.";
        else paint();
      }

      function chooseMime() {
        var key = preferredKey();
        return key ? supportedMime(key) : "";
      }

      function onData(event) {
        if (event.data && event.data.size > 0) chunks.push(event.data);
        if (pendingFlush) {
          var done = pendingFlush;
          pendingFlush = null;
          done();
        }
      }

      function flush() {
        if (!recorder || recorder.state !== "recording") return Promise.resolve();
        return new Promise(function (resolve) {
          pendingFlush = resolve;
          try {
            recorder.requestData();
          } catch (error) {
            pendingFlush = null;
            resolve();
          }
        });
      }

      function stopTracks() {
        if (!stream) return;
        stream.getTracks().forEach(function (track) { track.stop(); });
        stream = null;
      }

      function releaseRecorder() {
        var current = recorder;
        recorder = null;
        if (!current || current.state === "inactive") return Promise.resolve();
        return new Promise(function (resolve) {
          current.addEventListener("stop", function () { resolve(); }, { once: true });
          try { current.stop(); } catch (error) { resolve(); }
        });
      }

      async function releaseWakeLock() {
        if (!wakeLock) return;
        try { await wakeLock.release(); } catch (error) {}
        wakeLock = null;
      }

      async function keepScreenOn() {
        if (!navigator.wakeLock) {
          statusEl.textContent = "화면을 켜 두세요. 화면이 꺼지면 녹음이 멈출 수 있습니다.";
          return;
        }
        try {
          wakeLock = await navigator.wakeLock.request("screen");
        } catch (error) {
          statusEl.textContent = "화면을 켜 두세요. 화면이 꺼지면 녹음이 멈출 수 있습니다.";
        }
      }

      function beginClock() {
        segmentStart = Date.now();
        window.clearInterval(timer);
        timer = window.setInterval(tick, 250);
      }

      function freezeClock() {
        accumulated += Date.now() - segmentStart;
        window.clearInterval(timer);
      }

      async function beginNewTake() {
        mime = chooseMime();
        if (!mime) {
          statusEl.textContent = "이 브라우저는 녹음 형식을 지원하지 않습니다.";
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusEl.textContent = "이 브라우저는 마이크를 열 수 없습니다.";
          return;
        }
        await releaseRecorder();
        stopTracks();
        chunks = [];
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: false,
              sampleRate: { ideal: 48000 }
            }
          });
        } catch (error) {
          statusEl.textContent = "마이크 권한을 허용해야 녹음할 수 있습니다. 브라우저 설정에서 마이크를 허용하세요.";
          return;
        }
        try {
          recorder = new MediaRecorder(stream, {
            mimeType: mime,
            audioBitsPerSecond: QUALITY[preferredQuality()].bits
          });
        } catch (error) {
          try {
            recorder = new MediaRecorder(stream, { mimeType: mime });
          } catch (second) {
            stopTracks();
            recorder = null;
            statusEl.textContent = "이 브라우저는 녹음 형식을 지원하지 않습니다.";
            return;
          }
        }
        recorder.addEventListener("dataavailable", onData);
        try {
          recorder.start(1000);
        } catch (error) {
          stopTracks();
          recorder = null;
          statusEl.textContent = "이 브라우저는 녹음 형식을 지원하지 않습니다.";
          return;
        }
        stamp = stampNow();
        nextIndex = 1;
        accumulated = 0;
        state = "recording";
        statusEl.textContent = "녹음 중";
        beginClock();
        await keepScreenOn();
      }

      function resumeTake() {
        if (!recorder || recorder.state !== "paused") return;
        recorder.resume();
        state = "recording";
        statusEl.textContent = "녹음 중";
        beginClock();
        keepScreenOn();
      }

      startBtn.addEventListener("click", async function () {
        if (busy || state === "recording") return;
        busy = true;
        paint();
        try {
          if (state === "paused") resumeTake();
          else await beginNewTake();
        } finally {
          busy = false;
          paint();
        }
      });

      pauseBtn.addEventListener("click", function () {
        if (busy || state !== "recording" || !recorder || recorder.state !== "recording") return;
        recorder.pause();
        state = "paused";
        freezeClock();
        statusEl.textContent = "일시정지";
        paint();
      });

      function saveBlob() {
        var blob = new Blob(chunks, { type: mime || "audio/webm" });
        var name = fileBase(nextIndex) + extension();
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = name;
        link.click();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        return name;
      }

      function resetTake() {
        state = "idle";
        stamp = "";
        nextIndex = 1;
        chunks = [];
        mime = "";
        accumulated = 0;
        segmentStart = 0;
        window.clearInterval(timer);
      }

      stopBtn.addEventListener("click", async function () {
        if (busy || (state !== "recording" && state !== "paused")) return;
        busy = true;
        paint();
        try {
          if (state === "recording") freezeClock();
          await releaseRecorder();
          stopTracks();
          await releaseWakeLock();
          var name = chunks.length > 0 ? saveBlob() : "";
          resetTake();
          statusEl.textContent = name ? ("저장함 " + name) : "녹음이 없습니다. Start를 누르세요.";
        } finally {
          busy = false;
          paint();
        }
      });

      downloadBtn.addEventListener("click", async function () {
        if (busy) return;
        if (!stamp || elapsedMs() < 1000 && chunks.length === 0) {
          statusEl.textContent = "녹음이 없습니다. Start를 누르세요.";
          return;
        }
        busy = true;
        paint();
        try {
          await flush();
          if (chunks.length === 0) {
            statusEl.textContent = "녹음이 없습니다. Start를 누르세요.";
            return;
          }
          var name = saveBlob();
          nextIndex += 1;
          statusEl.textContent = "저장함 " + name;
        } finally {
          busy = false;
          paint();
        }
      });

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && state === "recording") keepScreenOn();
      });

      var settingBtn = document.getElementById("setting");
      var settingPanel = document.getElementById("setting-panel");
      var settingNote = document.getElementById("setting-note");
      var formatChoices = document.getElementById("format-choices");
      var qualityChoices = document.getElementById("quality-choices");
      var formatKeys = availableKeys();
      var chosenKey = preferredKey();
      var qualityKey = preferredQuality();

      if (formatKeys.length === 0) {
        settingNote.textContent = "이 브라우저는 녹음 형식을 지원하지 않습니다.";
      } else {
        formatKeys.forEach(function (key) {
          var label = document.createElement("label");
          var input = document.createElement("input");
          input.type = "radio";
          input.name = "format";
          input.value = key;
          input.checked = key === chosenKey;
          input.addEventListener("change", function () {
            if (!input.checked) return;
            try { localStorage.setItem("voiceRecFormat", key); } catch (error) {}
            markAppliedLater();
          });
          label.appendChild(input);
          label.appendChild(document.createTextNode(FORMATS[key].label));
          formatChoices.appendChild(label);
        });
        if (formatKeys.indexOf("m4a") === -1) {
          settingNote.textContent = "이 브라우저는 M4A를 만들지 못합니다. WebM만 저장됩니다.";
        }
      }

      ["high", "mid", "low"].forEach(function (key) {
        var label = document.createElement("label");
        var input = document.createElement("input");
        input.type = "radio";
        input.name = "quality";
        input.value = key;
        input.checked = key === qualityKey;
        input.addEventListener("change", function () {
          if (!input.checked) return;
          try { localStorage.setItem("voiceRecQuality", key); } catch (error) {}
          markAppliedLater();
        });
        label.appendChild(input);
        label.appendChild(document.createTextNode(QUALITY[key].label));
        qualityChoices.appendChild(label);
      });

      settingBtn.addEventListener("click", function () {
        var willOpen = settingPanel.hidden;
        settingPanel.hidden = !willOpen;
        settingBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
      });

      paint();
    })();
  </script>
</body>
</html>
